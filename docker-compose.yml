services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: 'testdb'
      MYSQL_ROOT_PASSWORD: 'password'
    ports:
      - '3306:3306'
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  webapi:
    build: .
    ports:
      - '80:5000'
    environment:
      CONNECTION_STRING: "Server=db;Database=testdb;User ID=root;Password=password"
    depends_on:
      db:
        condition: service_healthy